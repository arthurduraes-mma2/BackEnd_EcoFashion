<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoFashion | Cadastro</title>
  <link rel="stylesheet" href="cadastro.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23163b1f'/><text x='50' y='72' font-size='65' text-anchor='middle' fill='%23eab308' font-family='sans-serif' font-weight='bold'>E</text></svg>" />
  <style>
    .alerta-form {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 16px;
      text-align: left;
    }
    .alerta-form.erro {
      display: block;
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .alerta-form.sucesso {
      display: block;
      background-color: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }
    .secao-titulo {
      font-size: 1rem;
      font-weight: 700;
      color: #163b1f;
      margin: 20px 0 12px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      text-align: left;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">🌿 EcoFashion</div>
    <nav class="nav-links">
      <a href="../index.html">Início</a>
      <a href="../pages/produtos.html">Produtos</a>
      <a href="../pages/carrinho.html">Carrinho</a>
      <a href="../pages/minhas-compras.html">Minhas compras</a>
      <a href="login.html">Entrar</a>
    </nav>
  </header>

  <main class="container">
    <div class="card-cadastro">
      <h1>Criar Nova Conta</h1>
      <p class="subtitulo">Junte-se à comunidade de moda sustentável.</p>

      <form id="form-cadastro">
        <div class="campo">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />
        </div>

        <div class="campo">
          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required />
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required />
          </div>

          <div class="campo">
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required />
          </div>
        </div>

        <div class="campo">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required />
        </div>

        <div class="campo">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required />
        </div>

        <div class="secao-titulo">Endereço de Entrega</div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required />
          </div>

          <div class="campo">
            <label for="estado">Estado (UF):</label>
            <input type="text" id="estado" name="estado" placeholder="Ex: SP" maxlength="2" required />
          </div>
        </div>

        <div class="campo">
          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required />
        </div>

        <div class="campo">
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro" required />
        </div>

        <div class="linha-dupla">
          <div class="campo" style="flex: 2;">
            <label for="rua">Rua / Avenida:</label>
            <input type="text" id="rua" name="rua" placeholder="Nome da rua" required />
          </div>

          <div class="campo" style="flex: 1;">
            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" placeholder="Nº" required />
          </div>
        </div>

        <div class="campo">
          <label for="complemento">Complemento (opcional):</label>
          <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco, casa..." />
        </div>

        <div id="mensagem-cadastro" class="alerta-form"></div>

        <button type="submit" class="btn-cadastrar">Cadastrar</button>
      </form>

      <p class="link-login">
        Já possui conta? <a href="login.html">Faça login</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    © 2026 EcoFashion — Moda sustentável para preservar o planeta.
  </footer>

  <script>
    document.getElementById("cpf").addEventListener("input", function (e) {
      let v = e.target.value.replace(/\D/g, "");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      e.target.value = v;
    });

    document.getElementById("telefone").addEventListener("input", function (e) {
      let v = e.target.value.replace(/\D/g, "");
      v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
      v = v.replace(/(\d)(\d{4})$/, "$1-$2");
      e.target.value = v;
    });

    // Máscara e busca automática de endereço via ViaCEP
    document.getElementById("cep").addEventListener("input", async function (e) {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 5) {
        e.target.value = v.slice(0, 5) + "-" + v.slice(5, 8);
      } else {
        e.target.value = v;
      }

      if (v.length === 8) {
        try {
          const resp = await fetch(`https://viacep.com.br/ws/${v}/json/`);
          const dados = await resp.json();
          if (!dados.erro) {
            document.getElementById("rua").value = dados.logradouro || "";
            document.getElementById("bairro").value = dados.bairro || "";
            document.getElementById("cidade").value = dados.localidade || "";
            document.getElementById("estado").value = dados.uf || "";
            document.getElementById("numero").focus();
          }
        } catch (err) {
          console.warn("Não foi possível buscar o CEP automaticamente.");
        }
      }
    });
  </script>
  <script src="cadastro.js"></script>
</body>
</html>
